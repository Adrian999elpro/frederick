<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co https://www.frederickwinslowtaylor.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co ws://127.0.0.1:* http://127.0.0.1:* ws://localhost:* http://localhost:*; font-src 'self' data:; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <script>/* Solo en local: muestra qué URL bloquea exactamente la CSP */
    if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) document.addEventListener("securitypolicyviolation", function (e) {
      console.warn("[CSP]", e.violatedDirective, "bloqueó:", e.blockedURI, e.sourceFile ? "(" + e.sourceFile + ":" + e.lineNumber + ")" : "");
    });
  </script>
  <title>Panel Institucional · Frederick Winslow Taylor</title>
  <link rel="icon" type="image/png" href="https://www.frederickwinslowtaylor.com/Imagenes/sello.png">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="app-body">

<!-- Header Moderno y Unificado FWT -->
<header class="modern-header">
  <div class="header-top">
    <div class="brand-cluster">
      <div class="seal-frame">
        <img data-logo src="https://www.frederickwinslowtaylor.com/Imagenes/sello.png" alt="Sello FWT" width="40" height="40">
      </div>
      <div class="brand-titles">
        <div class="brand-main" data-short>FREDERICK WINSLOW TAYLOR</div>
        <div class="brand-sub">Unidad Educativa Técnica Particular</div>
      </div>
      <span class="motto-chip">#Calidad Más No Cantidad</span>
    </div>

    <div class="header-actions">
      <div class="user-profile-badge">
        <div class="user-avatar-circle">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>
        <span id="who" class="user-text-name">Usuario</span>
      </div>
      <button id="logout" class="btn-logout-modern" type="button" title="Cerrar sesión">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
        <span>Salir</span>
      </button>
    </div>
  </div>

  <!-- Barra de Navegación Moderna estilo Tabs/Pill -->
  <nav class="modern-nav-bar" aria-label="Navegación principal">
    <div id="nav" class="nav-track"></div>
  </nav>
</header>

<!-- Área de Contenido Principal -->
<main id="main" class="main" tabindex="-1"></main>

<!-- Notificaciones Toast Flotantes -->
<div id="toasts" class="toasts" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
