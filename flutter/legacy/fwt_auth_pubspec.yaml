name: fwt_auth
description: Módulo escolar y de autenticación institucional FWT (Supabase) con sensor NFC, toma de asistencia diaria única, votación con sensor, perfiles customizables y modo kiosko administrador.
version: 1.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  flutter_secure_storage: ^9.2.2
  nfc_manager: ^3.3.0

flutter:
  uses-material-design: true
